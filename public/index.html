<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睿成小樹苗學堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --cream:#FFF8F0;
    --paper:#FFFFFF;
    --paper-2:#FFF3E8;
    --ink:#4A3B33;
    --ink-soft:#93837A;
    --ink-faint:#C7B8AE;
    --border:#F0DFD1;
    --coral:#FF8B66;
    --coral-dark:#E96F4A;
    --coral-soft:#FFE6D9;
    --sun:#F0AE3C;
    --sun-soft:#FDEFCB;
    --leaf:#5FA870;
    --leaf-soft:#E1F1E3;
    --sky:#4E97B4;
    --sky-soft:#DCEFF4;
    --grape:#9A72BE;
    --grape-soft:#EFE4F5;
    --shadow: 0 10px 28px -10px rgba(74,59,51,0.22);
    --focus: 0 0 0 3px rgba(255,139,102,0.45);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#231B16;
      --paper:#2E241D;
      --paper-2:#382A20;
      --ink:#F6E9DE;
      --ink-soft:#C7B3A5;
      --ink-faint:#7C6759;
      --border:#4A392E;
      --coral:#FF9D78;
      --coral-dark:#FFB697;
      --coral-soft:#48301F;
      --sun:#F0C061;
      --sun-soft:#453519;
      --leaf:#8ECB9A;
      --leaf-soft:#2B3C2A;
      --sky:#84C6E0;
      --sky-soft:#233A40;
      --grape:#C6A6E0;
      --grape-soft:#392E41;
      --shadow: 0 10px 28px -10px rgba(0,0,0,0.55);
    }
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Baloo 2','Noto Sans TC',sans-serif;
    padding-inline:16px;
    padding-block:28px;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
  .app{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  h1,h2,h3{ margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }

  #banner{
    background:var(--sun-soft);
    border:1px solid var(--sun);
    color:var(--ink);
    border-radius:14px;
    padding:12px 16px;
    font-size:14px;
    line-height:1.6;
  }

  .panel{
    background:var(--paper);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:24px;
  }

  #view-grade .hero{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding-block:8px 4px;
  }
  #view-grade .mascot{ width:132px; height:132px; }
  #view-grade h1{ font-size:26px; font-weight:800; letter-spacing:.02em; }
  #view-grade .tagline{ color:var(--ink-soft); font-size:15px; max-width:36ch; line-height:1.7; }

  .grade-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  .grade-card{
    all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:10px;
    padding:18px 16px; border-radius:22px; border:2px solid transparent; background:var(--card-soft);
    transition:transform .15s ease, border-color .15s ease;
  }
  .grade-card:hover{ transform:translateY(-2px); }
  .grade-card:focus-visible{ box-shadow:var(--focus); border-color:var(--card-color); }
  .grade-card:active{ transform:translateY(0px) scale(.98); }
  .grade-card .icon-wrap{ width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--paper); }
  .grade-card .icon-wrap svg{ width:28px; height:28px; }
  .grade-card .label{ font-weight:700; font-size:17px; color:var(--ink); }
  .grade-card .sub{ font-size:13px; color:var(--ink-soft); font-weight:500; }

  .card-low{ --card-soft:var(--sun-soft); --card-color:var(--sun); }
  .card-mid{ --card-soft:var(--leaf-soft); --card-color:var(--leaf); }
  .card-high{ --card-soft:var(--sky-soft); --card-color:var(--sky); }
  .card-junior{ --card-soft:var(--grape-soft); --card-color:var(--grape); }

  .footnote{ text-align:center; font-size:12.5px; color:var(--ink-faint); line-height:1.6; }

  #view-chat{ display:flex; flex-direction:column; gap:14px; }
  .chat-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; background:var(--paper); border-radius:20px; box-shadow:var(--shadow); }
  .chat-header .who{ display:flex; align-items:center; gap:10px; min-width:0; }
  .chat-header .who .badge-icon{ width:38px;height:38px;border-radius:50%; background:var(--sun-soft); display:flex;align-items:center;justify-content:center; flex:none; }
  .chat-header .who .badge-icon svg{ width:22px;height:22px; }
  .chat-header .who .txt{ min-width:0; }
  .chat-header .who .txt .t1{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .chat-header .who .txt .t2{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn{ all:unset; cursor:pointer; font-size:13px; font-weight:700; color:var(--coral-dark); padding:8px 12px; border-radius:999px; background:var(--coral-soft); white-space:nowrap; }
  .icon-btn:hover{ filter:brightness(0.97); }
  .icon-btn:focus-visible{ box-shadow:var(--focus); }

  #messages{ display:flex; flex-direction:column; gap:12px; min-height:180px; }
  .bubble-row{ display:flex; gap:10px; align-items:flex-end; }
  .bubble-row.student{ justify-content:flex-end; }
  .avatar{ width:32px;height:32px;border-radius:50%; background:var(--coral-soft); display:flex;align-items:center;justify-content:center; flex:none; }
  .avatar svg{ width:20px;height:20px; }
  .bubble{ max-width:78%; padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
  .bubble-row.tutor .bubble{ background:var(--paper-2); border-bottom-left-radius:6px; color:var(--ink); }
  .bubble-row.student .bubble{ background:var(--coral); color:#fff; border-bottom-right-radius:6px; }
  .bubble.thinking{ color:var(--ink-soft); font-style:normal; }
  .bubble.thinking .dots span{ display:inline-block; width:5px; height:5px; margin-inline:1px; border-radius:50%; background:var(--ink-faint); animation:bounce 1.1s infinite ease-in-out; }
  .bubble.thinking .dots span:nth-child(2){ animation-delay:.15s; }
  .bubble.thinking .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform:translateY(0); opacity:.5;} 40%{ transform:translateY(-4px); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .bubble.thinking .dots span{ animation:none; } }
  .bubble.error-bubble{ background:var(--sun-soft); color:var(--ink); border:1px solid var(--sun); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ all:unset; cursor:pointer; font-size:13px; padding:8px 14px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--border); }
  .chip:hover{ color:var(--ink); border-color:var(--coral); }
  .chip:focus-visible{ box-shadow:var(--focus); }

  .composer{ display:flex; align-items:flex-end; gap:10px; background:var(--paper); border-radius:22px; box-shadow:var(--shadow); padding:10px 10px 10px 18px; }
  #input{ flex:1; resize:none; border:none; outline:none; background:transparent; color:var(--ink); font-family:'Noto Sans TC',sans-serif; font-size:15px; line-height:1.6; max-height:120px; min-height:24px; padding-block:8px; }
  #input::placeholder{ color:var(--ink-faint); }
  #sendBtn{ all:unset; cursor:pointer; flex:none; width:44px;height:44px; border-radius:50%; background:var(--coral); display:flex;align-items:center;justify-content:center; transition:transform .1s ease, opacity .15s ease; }
  #sendBtn svg{ width:20px;height:20px; }
  #sendBtn:hover{ transform:scale(1.05); }
  #sendBtn:active{ transform:scale(.95); }
  #sendBtn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  #sendBtn:focus-visible{ box-shadow:var(--focus); }

  #photoBtn{ all:unset; cursor:pointer; flex:none; width:40px;height:40px; border-radius:50%; background:var(--paper-2); display:flex;align-items:center;justify-content:center; transition:transform .1s ease; }
  #photoBtn svg{ width:19px;height:19px; }
  #photoBtn:hover{ transform:scale(1.05); }
  #photoBtn:active{ transform:scale(.95); }
  #photoBtn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
  #photoBtn:focus-visible{ box-shadow:var(--focus); }

  #attachPreview{ display:flex; align-items:center; gap:10px; background:var(--paper); border-radius:16px; box-shadow:var(--shadow); padding:8px 12px; }
  #attachPreview img{ width:44px;height:44px; object-fit:cover; border-radius:10px; flex:none; }
  #attachPreview .cap{ flex:1; font-size:13px; color:var(--ink-soft); }
  #attachRemove{ all:unset; cursor:pointer; font-size:18px; line-height:1; color:var(--ink-faint); padding:6px; }
  #attachRemove:hover{ color:var(--ink-soft); }

  .msg-img{ max-width:100%; border-radius:12px; display:block; }
  .bubble .msg-img + .msg-text{ margin-top:8px; }

  #stopBtn{ all:unset; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink-soft); padding:6px 12px; border-radius:999px; border:1px solid var(--border); align-self:center; }
  .composer-row{ display:flex; flex-direction:column; gap:8px; }

  #view-gate{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; }
  #view-gate .mascot{ width:96px; height:96px; }
  #view-gate h1{ font-size:22px; font-weight:800; }
  #view-gate p{ color:var(--ink-soft); font-size:14px; line-height:1.6; max-width:32ch; }
  #gateForm{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; }
  #gateInput{
    width:100%; text-align:center; letter-spacing:.08em; font-size:18px;
    padding:12px 16px; border-radius:16px; border:2px solid var(--border);
    background:var(--paper-2); color:var(--ink); font-family:'Noto Sans TC',sans-serif;
    outline:none;
  }
  #gateInput:focus{ border-color:var(--coral); }
  #gateSubmit{
    all:unset; cursor:pointer; text-align:center; font-weight:700; color:#fff;
    background:var(--coral); border-radius:999px; padding:12px 16px;
  }
  #gateSubmit:hover{ filter:brightness(1.05); }
  #gateSubmit:disabled{ opacity:.5; cursor:not-allowed; }
  #gateError{ color:var(--coral-dark); font-size:13px; min-height:1.2em; }
</style>
</head>
<body>
<div class="app">
  <div id="banner" hidden></div>

  <section id="view-gate" class="panel" hidden>
    <svg class="mascot" viewBox="0 0 200 200" aria-hidden="true">
      <path d="M62 150 L138 150 L128 192 L72 192 Z" fill="var(--coral)"/>
      <rect x="56" y="138" width="88" height="16" rx="8" fill="var(--coral-dark)"/>
      <path d="M100 138 C86 108 60 108 48 86 C74 82 96 96 100 118 C104 96 126 82 152 86 C140 108 114 108 100 138 Z" fill="var(--leaf)"/>
      <circle cx="100" cy="110" r="36" fill="var(--sun)"/>
      <circle cx="88" cy="112" r="4" fill="var(--ink)"/>
      <circle cx="112" cy="112" r="4" fill="var(--ink)"/>
      <path d="M89 124 Q100 132 111 124" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>睿成小樹苗學堂</h1>
    <p>請輸入老師給你的通關密碼，就可以開始囉！</p>
    <form id="gateForm">
      <input id="gateInput" type="text" inputmode="text" autocomplete="off" placeholder="通關密碼" maxlength="60">
      <button id="gateSubmit" type="submit">進入學堂</button>
      <div id="gateError" role="alert"></div>
    </form>
  </section>

  <section id="view-grade" hidden>
    <div class="panel hero">
      <svg class="mascot" viewBox="0 0 200 200" aria-hidden="true">
        <ellipse cx="100" cy="182" rx="52" ry="8" fill="var(--ink)" opacity="0.06"/>
        <path d="M62 150 L138 150 L128 192 L72 192 Z" fill="var(--coral)"/>
        <rect x="56" y="138" width="88" height="16" rx="8" fill="var(--coral-dark)"/>
        <path d="M100 138 C86 108 60 108 48 86 C74 82 96 96 100 118 C104 96 126 82 152 86 C140 108 114 108 100 138 Z" fill="var(--leaf)"/>
        <circle cx="100" cy="110" r="36" fill="var(--sun)"/>
        <circle cx="80" cy="120" r="7" fill="var(--sun-soft)" opacity="0.6"/>
        <circle cx="88" cy="112" r="4" fill="var(--ink)"/>
        <circle cx="112" cy="112" r="4" fill="var(--ink)"/>
        <path d="M89 124 Q100 132 111 124" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h1>睿成小樹苗學堂</h1>
      <p class="tagline">先選一下你現在的年級，老師會用最適合你的方式，陪你一步一步把題目想通！</p>
    </div>

    <div class="panel">
      <div class="grade-grid" id="gradeGrid"></div>
    </div>

    <p class="footnote">小提醒：老師不會直接告訴你答案喔，會先問問你的想法，陪你一起想～</p>
  </section>

  <section id="view-chat" hidden>
    <div class="chat-header">
      <div class="who">
        <div class="badge-icon" id="chatGradeIcon"></div>
        <div class="txt">
          <div class="t1">目前年級</div>
          <div class="t2" id="chatGradeLabel">—</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="newQuestionBtn" type="button">換一題</button>
        <button class="icon-btn" id="changeGradeBtn" type="button">換年級</button>
      </div>
    </div>

    <div class="panel" style="padding-bottom:18px;">
      <div id="messages"></div>
      <div class="chips" id="exampleChips" style="margin-top:12px;"></div>
    </div>

    <div class="composer-row">
      <button id="stopBtn" type="button" hidden>■ 停止老師思考</button>
      <div id="attachPreview" hidden>
        <img id="attachThumb" alt="已附上的題目照片">
        <span class="cap">已附上一張照片</span>
        <button id="attachRemove" type="button" aria-label="移除照片">✕</button>
      </div>
      <div class="composer">
        <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" capture="environment" hidden>
        <button id="photoBtn" type="button" aria-label="拍照或上傳題目照片">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 8.5C4 7.67 4.67 7 5.5 7H8L9 5H15L16 7H18.5C19.33 7 20 7.67 20 8.5V17.5C20 18.33 19.33 19 18.5 19H5.5C4.67 19 4 18.33 4 17.5V8.5Z" stroke="var(--ink-soft)" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="3.4" stroke="var(--ink-soft)" stroke-width="1.6"/>
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="打出題目，或按左邊拍照上傳……" maxlength="800"></textarea>
        <button id="sendBtn" type="button" aria-label="送出">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="#fff"/>
          </svg>
        </button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var GRADES = {
    low:    { label:"國小低年級", sub:"1〜2 年級", cls:"card-low",
              examples:["9加7等於多少？","哪一個比較重：1公斤的棉花還是1公斤的石頭？"] },
    mid:    { label:"國小中年級", sub:"3〜4 年級", cls:"card-mid",
              examples:["300公克是幾公斤？","一條繩子剪成4段一樣長，每段是全長的幾分之幾？"] },
    high:   { label:"國小高年級", sub:"5〜6 年級", cls:"card-high",
              examples:["長方形的面積怎麼算？","為什麼樹葉大多是綠色的？"] },
    junior: { label:"國中",      sub:"7〜9 年級", cls:"card-junior",
              examples:["解方程式：2x+3=11","為什麼冬天比較容易感冒？"] }
  };

  var ICONS = {
    low: '<svg viewBox="0 0 40 40"><circle cx="20" cy="26" r="7" fill="var(--sun)"/><path d="M20 26 C20 20 16 18 12 16" stroke="var(--leaf)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
    mid: '<svg viewBox="0 0 40 40"><path d="M20 30 L20 14" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/><ellipse cx="13" cy="17" rx="6" ry="4" fill="var(--leaf)" transform="rotate(-30 13 17)"/><ellipse cx="27" cy="17" rx="6" ry="4" fill="var(--leaf)" transform="rotate(30 27 17)"/><circle cx="20" cy="31" r="3" fill="var(--sun)"/></svg>',
    high: '<svg viewBox="0 0 40 40"><path d="M20 32 L20 10" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/><ellipse cx="12" cy="14" rx="5.5" ry="3.5" fill="var(--leaf)" transform="rotate(-35 12 14)"/><ellipse cx="28" cy="14" rx="5.5" ry="3.5" fill="var(--leaf)" transform="rotate(35 28 14)"/><ellipse cx="11" cy="24" rx="5.5" ry="3.5" fill="var(--leaf)" transform="rotate(-15 11 24)"/><ellipse cx="29" cy="24" rx="5.5" ry="3.5" fill="var(--leaf)" transform="rotate(15 29 24)"/></svg>',
    junior: '<svg viewBox="0 0 40 40"><rect x="18" y="24" width="4" height="10" rx="2" fill="var(--coral-dark)"/><circle cx="20" cy="16" r="11" fill="var(--leaf)"/></svg>'
  };

  var TUTOR_ICON = '<svg viewBox="0 0 40 40"><circle cx="20" cy="16" r="10" fill="var(--sun)"/><circle cx="17" cy="15" r="2" fill="var(--ink)"/><circle cx="23" cy="15" r="2" fill="var(--ink)"/><path d="M16 19 Q20 22 24 19" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M8 34 Q20 22 32 34" fill="var(--coral)"/></svg>';
  var STUDENT_ICON = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="#fff" opacity="0.25"/><circle cx="20" cy="15" r="7" fill="#fff"/><path d="M8 33 Q20 20 32 33" fill="#fff"/></svg>';

  var state = { grade:null, history:[], pendingImage:null, sending:false, controller:null };

  var el = {
    banner: document.getElementById("banner"),
    viewGate: document.getElementById("view-gate"),
    gateForm: document.getElementById("gateForm"),
    gateInput: document.getElementById("gateInput"),
    gateSubmit: document.getElementById("gateSubmit"),
    gateError: document.getElementById("gateError"),
    viewGrade: document.getElementById("view-grade"),
    viewChat: document.getElementById("view-chat"),
    gradeGrid: document.getElementById("gradeGrid"),
    chatGradeIcon: document.getElementById("chatGradeIcon"),
    chatGradeLabel: document.getElementById("chatGradeLabel"),
    newQuestionBtn: document.getElementById("newQuestionBtn"),
    changeGradeBtn: document.getElementById("changeGradeBtn"),
    messages: document.getElementById("messages"),
    exampleChips: document.getElementById("exampleChips"),
    input: document.getElementById("input"),
    sendBtn: document.getElementById("sendBtn"),
    stopBtn: document.getElementById("stopBtn"),
    photoBtn: document.getElementById("photoBtn"),
    photoInput: document.getElementById("photoInput"),
    attachPreview: document.getElementById("attachPreview"),
    attachThumb: document.getElementById("attachThumb"),
    attachRemove: document.getElementById("attachRemove")
  };

  function showBanner(msg){ el.banner.textContent = msg; el.banner.hidden = false; }

  function buildGradeGrid(){
    ["low","mid","high","junior"].forEach(function(key){
      var g = GRADES[key];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "grade-card " + g.cls;
      btn.innerHTML =
        '<span class="icon-wrap">' + ICONS[key] + '</span>' +
        '<span class="label">' + g.label + '</span>' +
        '<span class="sub">' + g.sub + '</span>';
      btn.addEventListener("click", function(){ startGrade(key); });
      el.gradeGrid.appendChild(btn);
    });
  }

  function startGrade(key){
    state.grade = key;
    var g = GRADES[key];
    el.chatGradeIcon.innerHTML = ICONS[key];
    el.chatGradeLabel.textContent = g.label + "（" + g.sub + "）";
    resetConversation();
    el.viewGrade.hidden = true;
    el.viewChat.hidden = false;
    el.input.focus();
  }

  function resetConversation(){
    var g = GRADES[state.grade];
    state.history = [];
    el.messages.innerHTML = "";
    addGreeting();
    renderChips(g);
    clearAttachment();
    el.input.value = "";
    autosize();
  }

  function addGreeting(){
    var row = document.createElement("div");
    row.className = "bubble-row tutor";
    row.innerHTML = '<div class="avatar">' + TUTOR_ICON + '</div><div class="bubble">哈囉！我是你的解題小老師🌱\n說說看，你現在遇到什麼數學或自然的題目呢？打字或拍照上傳都可以喔！</div>';
    el.messages.appendChild(row);
  }

  function renderChips(g){
    el.exampleChips.innerHTML = "";
    g.examples.forEach(function(ex){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = ex;
      chip.addEventListener("click", function(){ el.input.value = ex; autosize(); el.input.focus(); });
      el.exampleChips.appendChild(chip);
    });
  }

  function autosize(){
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 120) + "px";
  }
  el.input.addEventListener("input", autosize);
  el.input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); trySend(); }
  });
  el.sendBtn.addEventListener("click", trySend);
  el.newQuestionBtn.addEventListener("click", resetConversation);
  el.changeGradeBtn.addEventListener("click", function(){
    el.viewChat.hidden = true;
    el.viewGrade.hidden = false;
  });
  el.stopBtn.addEventListener("click", function(){
    if (state.controller) state.controller.abort();
  });

  var MAX_IMAGE_BYTES = 8 * 1024 * 1024;
  var ALLOWED_IMAGE_TYPES = ["image/jpeg","image/png","image/webp","image/gif"];

  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var outW = Math.max(1, Math.round(w * scale));
        var outH = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = outW;
        canvas.height = outH;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, outW, outH);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob){
          if (blob) resolve(blob); else reject(new Error("resize failed"));
        }, "image/jpeg", quality);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("image load failed")); };
      img.src = url;
    });
  }

  el.photoBtn.addEventListener("click", function(){ el.photoInput.click(); });
  el.photoInput.addEventListener("change", async function(){
    var file = el.photoInput.files && el.photoInput.files[0];
    el.photoInput.value = "";
    if (!file) return;
    if (ALLOWED_IMAGE_TYPES.indexOf(file.type) === -1){
      addErrorBubble("這張照片格式老師看不了，請用 jpg、png、webp 或 gif 格式試試看。");
      return;
    }
    if (file.size > MAX_IMAGE_BYTES){
      addErrorBubble("這張照片檔案有點大，換一張小一點的照片試試看吧！");
      return;
    }
    // 縮小照片尺寸再上傳，可以省下不少 API 費用、上傳也更快
    var toUse = file;
    try{ toUse = await resizeImageFile(file, 1280, 0.82); }catch(err){ /* 縮圖失敗就直接用原圖 */ }
    state.pendingImage = toUse;
    el.attachThumb.src = URL.createObjectURL(toUse);
    el.attachPreview.hidden = false;
  });
  el.attachRemove.addEventListener("click", clearAttachment);

  function clearAttachment(){
    state.pendingImage = null;
    el.attachThumb.src = "";
    el.attachPreview.hidden = true;
  }

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(",")[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function addStudentBubble(text, imageUrl){
    var row = document.createElement("div");
    row.className = "bubble-row student";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (imageUrl){
      var img = document.createElement("img");
      img.className = "msg-img";
      img.src = imageUrl;
      img.alt = "學生上傳的題目照片";
      bubble.appendChild(img);
    }
    if (text){
      var textEl = document.createElement("div");
      textEl.className = "msg-text";
      textEl.textContent = text;
      bubble.appendChild(textEl);
    }
    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.style.background = "var(--coral)";
    avatar.innerHTML = STUDENT_ICON;
    row.appendChild(bubble);
    row.appendChild(avatar);
    el.messages.appendChild(row);
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function addTutorPlaceholder(){
    var row = document.createElement("div");
    row.className = "bubble-row tutor";
    row.innerHTML = '<div class="avatar">' + TUTOR_ICON + '</div><div class="bubble thinking">老師正在想怎麼引導你 <span class="dots"><span></span><span></span><span></span></span></div>';
    el.messages.appendChild(row);
    el.messages.scrollTop = el.messages.scrollHeight;
    return row.querySelector(".bubble");
  }

  function addErrorBubble(msg){
    var row = document.createElement("div");
    row.className = "bubble-row tutor";
    row.innerHTML = '<div class="avatar">' + TUTOR_ICON + '</div><div class="bubble error-bubble"></div>';
    row.querySelector(".bubble").textContent = msg;
    el.messages.appendChild(row);
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function setSending(isSending){
    state.sending = isSending;
    el.sendBtn.disabled = isSending;
    el.photoBtn.disabled = isSending;
    el.stopBtn.hidden = !isSending;
  }

  function trySend(){
    var text = el.input.value.trim();
    var image = state.pendingImage;
    if ((!text && !image) || state.sending) return;
    sendMessage(text, image);
  }

  async function sendMessage(text, imageFile){
    var displayUrl = imageFile ? URL.createObjectURL(imageFile) : null;
    addStudentBubble(text, displayUrl);
    el.input.value = "";
    autosize();
    clearAttachment();

    var bubbleEl = addTutorPlaceholder();
    var controller = new AbortController();
    state.controller = controller;
    setSending(true);

    try{
      var imagePayload = null;
      if (imageFile){
        var base64 = await fileToBase64(imageFile);
        imagePayload = { dataBase64: base64, mediaType: imageFile.type };
      }

      var res = await fetch("/api/tutor", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: controller.signal,
        body: JSON.stringify({ grade: state.grade, history: state.history, message: text, image: imagePayload })
      });

      var data = await res.json().catch(function(){ return {}; });

      if (res.status === 401){
        showGate();
        throw new Error(data.error || "請先輸入通關密碼再使用喔。");
      }
      if (!res.ok){
        throw new Error(data.error || "網路好像打嗝了，再按一次送出試試看吧！");
      }

      bubbleEl.classList.remove("thinking");
      bubbleEl.textContent = data.reply;
      state.history.push({ role:"user", content: text || "（這是我的題目照片，麻煩老師看一下）" });
      state.history.push({ role:"assistant", content: data.reply });
    }catch(err){
      if (err && err.name === "AbortError"){
        bubbleEl.parentElement.remove();
      } else {
        bubbleEl.classList.remove("thinking");
        bubbleEl.classList.add("error-bubble");
        bubbleEl.textContent = (err && err.message) || "網路好像打嗝了，再按一次送出試試看吧！";
      }
    }finally{
      setSending(false);
      state.controller = null;
    }
  }

  function showGate(){
    el.viewGrade.hidden = true;
    el.viewChat.hidden = true;
    el.viewGate.hidden = false;
    el.gateInput.value = "";
    el.gateInput.focus();
  }

  function showGrade(){
    el.viewGate.hidden = true;
    el.viewChat.hidden = true;
    el.viewGrade.hidden = false;
  }

  el.gateForm.addEventListener("submit", async function(e){
    e.preventDefault();
    var code = el.gateInput.value.trim();
    if (!code) return;
    el.gateSubmit.disabled = true;
    el.gateError.textContent = "";
    try{
      var res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code })
      });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok){
        el.gateError.textContent = data.error || "密碼不對，再檢查一下試試看！";
        return;
      }
      showGrade();
    }catch(err){
      el.gateError.textContent = "網路好像打嗝了，再試一次看看！";
    }finally{
      el.gateSubmit.disabled = false;
    }
  });

  async function init(){
    buildGradeGrid();
    try{
      var res = await fetch("/api/session");
      var data = await res.json();
      if (data.authenticated){
        showGrade();
      } else {
        showGate();
      }
    }catch(err){
      // 連不到伺服器就先當作不需要密碼，讓學生至少看得到畫面
      showGrade();
    }
  }

  init();
})();
</script>
</body>
</html>
